version: "1"
name: default
scorers:
  correctness:
    type: exact_match
    weight: 0.35
    case_sensitive: false
  groundedness:
    type: passage_overlap
    weight: 0.25
    min_overlap: 0.3
  policy_compliance:
    type: policy_check
    weight: 0.20
    policy_pack_ref: data/policies/stub.yaml
  refusal_quality:
    type: refusal_classifier
    weight: 0.05
  latency:
    type: latency_budget
    weight: 0.10
    budget_p95_ms: 2000
  completeness:
    type: non_empty
    weight: 0.05
aggregate:
  method: weighted_mean
