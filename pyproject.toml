[project]
name = "ai-workbench-controlplane"
version = "0.1.0"
description = "AI Workbench control plane — bundle lifecycle management"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "duckdb>=0.10.0",
    "httpx>=0.27.0",
    "jsonlines>=4.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "streamlit>=1.32.0",
    "altair>=5.0.0",
    "simpleeval>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
]

[project.scripts]
workbench = "workbench.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
